# nsfc-full-pipeline 配置文件
# 版本号管理：本文件是版本信息的唯一来源（Single Source of Truth）

skill_info:
  name: nsfc-full-pipeline
  version: 0.3.0
  description: "NSFC 标书全流程编排器，覆盖面上、青年、地区科学基金项目：按 00-14 阶段串联选题、文献调研、科学问题、研究方案、正文写作、引用核查、篇幅对齐、去 AI 味、QC、模拟评审、P0/P1 定点修复与编译；以 docs/workflow_status.yaml 为断点实现续跑，默认 draft-first——缺事实时按事实 ID 挖空占位并继续写作，补齐后按 ID 定点回填，仅在落点/项目类型/选题无法解析时阻塞（不适用：单章节写作、已有独立 skill 覆盖的单点任务、省级/地方科学基金项目）"
  author: "Bensz Conan"
  category: writing

# === 适用范围 ===
scope:
  in_scope_projects: [NSFC_General, NSFC_General_Clean, NSFC_Young, NSFC_Local, NSFC_Local_Clean]
  # 省级/地方基金章节体例不同（立论依据/研究工作基础/实验条件/项目组人员简介等），
  # 角色关键词不覆盖，篇幅与评审口径也不同；遇到时应显式说明不适用，而不是在 stage 00 静默卡死
  out_of_scope_projects: [GDNSF_General, GDNSF_Regional_Young, GXNSF_General]

# === 项目布局与项目类型解析（stage 00）===
# 各 NSFC 模板的章节编号不共用一套方案且互相重叠，必须先解析再写作。
layout:
  # 唯一真相来源：main.tex 中未被注释的 \input{extraTex/...}
  resolve_from: main.tex
  ignore_commented_input: true
  ignore_files:
    - "extraTex/@config.tex"
  # 已知布局，仅用于对解析结果做合理性校验，不替代读取 main.tex
  # *_Clean 变体与母模板同布局，只是正文出厂为空，不算第三种布局
  known:
    five-part:
      example_projects: [NSFC_Local, NSFC_Local_Clean]
      part_one: ["1.1", "1.2", "1.3", "1.4", "1.5"]
      foundation: ["2.1", "2.2", "2.3", "2.4"]
      statements: ["3.1", "3.2", "3.3", "3.4", "3.5"]
    three-part:
      example_projects: [NSFC_General, NSFC_General_Clean, NSFC_Young]
      part_one: ["1.1", "2.1", "2.2", "2.3"]
      foundation: ["3.1", "3.2", "3.3", "3.4"]
      statements: ["4.1", "4.2", "4.3", "4.4", "4.6"]
  # 解析失败或与两种已知布局都冲突时必须停下询问，不得猜测
  halt_on_unresolved: true

# === 项目类型与篇幅预算解析（stage 00，与布局同一趟完成）===
# 无默认值：解析不出来必须停下问用户，不得回退到地区基金
grant_type:
  resolve_order: [user_statement, project_agents_md, project_readme, project_dir_name]
  dir_name_hints:
    "NSFC_General*": 面上项目
    "NSFC_Young*": 青年科学基金
    "NSFC_Local*": 地区科学基金
  halt_on_unresolved: true
  # 篇幅预算按项目自带 AGENTS.md 读取，禁止跨项目类型套用
  length_budget_source: "<proposal_path>/AGENTS.md"
  known_budgets:
    NSFC_Local: "第一部分 ≤8000 字；全文 ≤30 页"
    NSFC_General: "全文 ≤30 页（无第一部分字数上限）"
    NSFC_Young: "全文 ≤30 页（无第一部分字数上限）"

# === 缺口策略（draft-first）===
# 缺事实是写作过程的常态，不是失败。默认挖空继续写，只在真正写不下去时阻塞。
# 注意：本策略只改变"何时停"，绝不改变"是否可以编造"。
gap_policy:
  default_fill_policy: draft_first    # draft_first | blocking
  checkpoint_field: run.fill_policy

  # 两类缺口：可推定的给草稿值，硬事实只挖空不猜
  kinds:
    assumable:
      marker: "【暂定 …】"
      requires_id: false
      blocks_submission: false
      examples: [年度计划月份切分, 预期成果数量口径, 实验规模, 指标阈值, baseline 选择]
    hard_fact:
      marker: "【待补 ID：说明】"
      requires_id: true               # ID 必须已存在于事实库，不另立第三份清单
      blocks_submission: true
      examples: [项目批准号, 经费额度, 已发表论文, 获奖, 平台型号与保障年限, 团队成员, 国基完成情况, 各类声明]

  marker_format:
    latex: "\\textbf{【待补 F-GEN-03：批准号与起止年份】}"
    # 不新增宏：必须能在 Overleaf、独立项目 zip 与任意已装 bensz-nsfc 版本下编译
    forbid_new_macro: true
    grep_patterns: ["【待补 ", "【暂定 "]
    # 挖空的必须是名词短语；整段只有一个占位 = 这段其实没写
    must_be_noun_phrase: true
  id_sources:
    - "docs/applicants/<slug>.md"      # F-GEN-*
    - "docs/00_项目事实库.md"           # 项目专属 ID

  # 分情况：按 stage 00 已解析出的角色判定，不逐条事实重新推导
  halt_on_missing:
    "00_layout_resolution": true       # 落点/项目类型解析不出来，无处可写
    "01_topic_extraction": true        # 选题未知则全篇皆为编造
    part_one: false                    # 论证章节，不应被履历型事实阻塞
    foundation: false                  # 证据罗列，句子骨架可先搭
    statements: false                  # 本身就是填空题
    checks_and_review: false           # 结论标注为暂定
    "14_compile": false                # 带缺口可编译，报告须写明数量
    declare_final: true                # 有待补即不得声称定稿/可提交

  # 缺口未清空前，篇幅结论一律暂定：挖空稿偏短，补完常多占 1-2 页
  length_verdict_provisional_while_gaps: true

  fillback_triggers: [我补充了, 补充完了, 信息补齐了, 补齐了, 填好了]
  scan_script: skills/nsfc-full-pipeline/scripts/scan_gaps.py

# === 断点与续跑 ===
checkpoint:
  file: docs/workflow_status.yaml
  # 阶段完成判定不能只看输出文件是否存在：
  # 模板自带 \NSFCBlankPara 占位，文件存在不等于已写作
  completion_requires_non_placeholder: true
  # 出厂占位/无锚点草稿标记：出现即视为该阶段未写作
  placeholder_markers:
    - "\\NSFCBlankPara"
    - "待填写"
    - "现有材料未列"
    - "项目编号未知"
  # 带 ID 的缺口标记不同于上面：正文已写、只是事实待补，不判定为未写作
  gap_markers_are_drafted: true
  statuses: [pending, in_progress, completed, drafted_with_gaps, skipped, need_user_input, failed]
  # drafted_with_gaps 续跑时不重跑；gaps 清空后才可转 completed
  completed_requires_empty_gaps: true

# === 参考文献充分性闸门（stage 05 前置）===
reference_gate:
  min_entries: 25
  target_entries: [30, 50]
  part_one_citations: [20, 35]
  recent_5y_ratio_min: 0.6
  allow_invented_references: false

# === 子 skill 编排 ===
sub_skills:
  "01_topic_extraction": [research-topic-extractor, research-guide-updater]
  "02_literature_review": [research-literature-review, research-guide-updater]
  "03_scientific_questions": [research-idea, research-guide-updater]
  "04_research_plan": [research-plan]
  "05_part_one_writing": [nsfc-justification-writer, nsfc-research-content-writer, research-plan]
  "06_research_foundation": [nsfc-research-foundation-writer]
  "08_reference_alignment": [nsfc-ref-alignment]
  "09_length_control": [nsfc-length-aligner]
  "10_humanization": [nsfc-humanization]
  "11_qc": [nsfc-qc]
  "12_simulated_review": [nsfc-reviewers]

# 本编排器不覆盖的环节；需要时由用户单独调用
not_covered:
  - skill: nsfc-abstract
    reason: "摘要为申请书必填项，但不在正文 extraTex 链路内，单独调用"
  - skill: nsfc-code
    reason: "申请代码推荐为只读输出，不影响正文写作链路"
  - skill: nsfc-budget
    reason: "预算说明书为独立 LaTeX 交付物，通常在正文接近定稿后单独生成"
  # 配图不属于本编排器：由用户自行完成，本流程不代为规划、不排进阶段、正文不擅自插图。
  # 此处不指向任何具体 skill —— 仓库与系统 skills 目录中都不存在可调用的标书配图 skill。
  - skill: null
    item: 标书配图
    reason: "配图由用户独立完成，本编排器只保证正文与编译链路，不代为规划或生成图件"

# === 模拟评审默认参数（stage 12）===
simulated_review:
  # grant_type 无默认值，取 stage 00 解析出的 project.grant_type；
  # 用错项目类型评审会套用错误的专家预期
  grant_type: null
  panel_count: 3          # 与 nsfc-reviewers 的 default_panel_count 一致
  max_panel_count: 5
  output_path: review/模拟专家评审_全稿.md

# === 编译（stage 14）===
build:
  # 仓库根目录运行
  repo_root_command: "python packages/bensz-nsfc/scripts/nsfc_project_tool.py build --project-dir <project-dir>"
  # 项目目录内运行；根目录 scripts/ 下没有该脚本
  project_dir_command: "python scripts/nsfc_build.py build --project-dir ."
  compile_requires_no_p0: true
