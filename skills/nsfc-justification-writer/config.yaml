skill_info:
  name: nsfc-justification-writer
  version: 1.2.0
  category: writing
  author: "Bensz Conan"

# 只影响措辞和证据重心，不作为结构通过条件。
style:
  mode: theoretical

parameters:
  project_root:
    type: string
    required: true
    description: 项目根目录

targets:
  # 可由用户、项目配置或 CLI 显式指定；为空时由只读候选发现决定，不自动写入。
  justification_tex: ""
  related_tex: {}
  bib_globs:
    - references/*.bib
    - references/**/*.bib

workspace:
  runs_dir: tests/_artifacts/runs

limits:
  max_file_size_mb: 5
  ai_max_input_chars: 20000
  word_target:
    min: 100
    max: 20000

ai:
  enabled: true
  tier2_chunk_size: 12000
  tier2_max_chunks: 20
  cache_dir: tests/_artifacts/cache/ai

prompts:
  tier2_diagnostic: assets/prompts/tier2_diagnostic.txt
  review_suggestions: assets/prompts/review_suggestions.txt
  writing_coach: assets/prompts/writing_coach.txt

references:
  # 缺失 bibkey 默认拒绝写入；这是事实守护，不是结构检查。
  allow_missing_citations: false

guardrails:
  # 兼容旧项目的安全默认值；自定义目标必须同步显式声明白名单。
  allowed_write_files:
    - extraTex/1.1.立项依据.tex
  forbidden_write_files:
    - main.tex
    - extraTex/@config.tex
  forbidden_write_globs:
    - "**/*.cls"
    - "**/*.sty"
  output_mode: preview
  require_explicit_confirmation: true

quality:
  # 吹牛式表述由宿主 AI 按 references/boastful_expression_guidelines.md 语义复核；
  # Python 不维护固定短语表，也不对正文措辞做硬编码判定。
  # 结构命令由 preview 的变更范围检查比较前后差异；不对现有正文中的命令逐字报警。
  avoid_commands: []

# 仅保留用户显式要求时的独立预警；默认不进行开篇 300 字或固定页数/文献数判定。
constraints: {}

word_count:
  target: 9000
  tolerance: 800
  mode: cjk_only

terminology:
  mode: auto
  enable_ai_semantic_check: true
  ai_mode: auto
  ai:
    enabled: true
    max_chars: 20000
  dimensions: {}

writing_coach:
  enable_ai_stage_inference: true
  ai_inference_mode: auto
  fallback_rules:
    draft_threshold_ratio: 0.4
    draft_min_chars: 600

slr_integration:
  enabled: true
  marker_folder: ".systematic-literature-review"
  read_only: true
  validate_citations: true
  tex_patterns:
    - "*.tex"
    - "*_review.tex"
  bib_patterns:
    - "*.bib"
    - "*_参考文献.bib"
    - "references.bib"
