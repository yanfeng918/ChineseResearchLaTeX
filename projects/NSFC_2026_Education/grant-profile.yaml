# 基金画像（grant-profile.yaml）
# 由 `python scripts/grant_profile.py infer` 生成，请人工复核后使用。
# 规范见 docs/grant-profile-spec.md。
#
# roles 的三种状态：
#   file:        本模板有独立文件承载该角色
#   merged_into: 本模板无独立文件，内容须写进目标角色（不可当作不用写）
#   absent:      本模板确实不要求该角色

grant:
  name: "国家自然科学基金-教育信息科学与技术"
  agency: "国家自然科学基金委员会"
  duration_years: 4
  source: "仓库内 NSFC 模板项目"

roles:
  justification:   # 立项依据
    file: "extraTex/1.1.立项依据.tex"
  research_content:   # 研究内容
    file: "extraTex/1.2.内容目标问题.tex"
  key_questions:   # 关键科学问题
    absent: true
  research_scheme:   # 研究方案与可行性
    file: "extraTex/1.3.方案及可行性.tex"
  innovation:   # 特色与创新
    file: "extraTex/1.4.特色与创新.tex"
  yearly_plan:   # 年度研究计划
    file: "extraTex/1.5.研究计划.tex"
  expected_results:   # 预期研究结果
    absent: true
  research_foundation:   # 研究基础
    file: "extraTex/2.1.研究基础.tex"
  work_conditions:   # 工作条件
    file: "extraTex/2.2.工作条件.tex"
  team_members:   # 项目组人员
    absent: true
  ongoing_projects:   # 申请或承担科研项目
    file: "extraTex/2.3.承担项目.tex"
  completed_projects:   # 项目完成情况
    file: "extraTex/2.4.项目完成情况.tex"
  ai_disclosure:   # 生成式人工智能声明
    absent: true
  budget_plan:   # 经费与预算
    absent: true
  management:   # 组织管理措施
    absent: true
  site_scale:   # 实施地点及规模
    absent: true
  attachments:   # 附件清单
    absent: true
  other:   # 其他
    file: "extraTex/3.5.其它.tex"

# 篇幅预算：沿用 skills/nsfc-length-aligner/config.yaml 的 2026 改版口径。
length_budget:
  unit: cjk_chars
  pages:
    max: 28
    hard_max: 30
  by_role:
    justification: [8000, 10000]
    research_content: [12000, 15000]
    research_foundation: [5000, 6000]
    innovation: [800, 1500]
    yearly_plan: [800, 1500]

# 模拟评审口径，供 nsfc-reviewers 使用。
review:
  grant_type: "面上项目"
  criteria:
    - "科学问题与假说是否清晰、可证伪"
    - "研究内容与目标是否对位，技术路线是否可执行"
    - "创新性是否可对照、可验证"
    - "研究基础与工作条件是否支撑可行性"
