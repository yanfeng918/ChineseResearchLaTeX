project:
  type: Lab_Open_Grant
  proposal_path: "."
  body_dir: "extraTex"
  bib_file: "references/myexample.bib"
  guide_file: "AGENTS.md"
  stage_output_dir: "docs"
  review_output_dir: "review"
  note: "教育部重点实验室开放课题，借用 NSFC 地区基金 LaTeX 结构写作；最终提交 Word 申请书。"

run:
  current_mode: resume
  last_started: "word_form_mapping"
  last_finished: "word_form_mapping"
  last_summary: "已按实验室模板生成 Word 申请书。经费按申请人确定为劳务费 3.5 万、业务费 1.5 万。第（三）部分按用户确认填写无相关情况。封面电话/邮箱/性别/出生年月/学位授予机构/联系地址仍为【待填】。"
  next_stage: "user_fill_personal_fields"

stages:
  "01_topic_extraction":
    name: "Topic Extraction"
    status: completed
    inputs:
      - "AGENTS.md"
      - "README.md"
      - "main.tex"
      - "docs/00_项目基本信息.md"
    outputs:
      - "docs/01_选题与研究主题.md"
    last_updated:
    notes:
    blockers:

  "02_literature_review":
    name: "Literature Review"
    status: completed
    inputs:
      - "AGENTS.md"
      - "docs/01_选题与研究主题.md"
      - "references/myexample.bib"
    outputs:
      - "docs/02_文献调研/"
    last_updated:
    notes:
    blockers:

  "03_scientific_questions":
    name: "Scientific Questions and Innovation"
    status: completed
    inputs:
      - "AGENTS.md"
      - "docs/01_选题与研究主题.md"
      - "docs/02_文献调研/"
    outputs:
      - "docs/03_科学问题与创新点.md"
    last_updated:
    notes:
    blockers:

  "04_research_plan":
    name: "Research Plan"
    status: completed
    inputs:
      - "AGENTS.md"
      - "docs/03_科学问题与创新点.md"
    outputs:
      - "docs/04_研究方案与技术路线.md"
    last_updated:
    notes:
    blockers:

  "05_part_one_writing":
    name: "NSFC Part One Writing"
    status: completed
    inputs:
      - "AGENTS.md"
      - "docs/04_研究方案与技术路线.md"
      - "references/myexample.bib"
    outputs:
      - "extraTex/1.1.立项依据.tex"
      - "extraTex/1.2.内容目标问题.tex"
      - "extraTex/1.3.方案及可行性.tex"
      - "extraTex/1.4.特色与创新.tex"
      - "extraTex/1.5.研究计划.tex"
    last_updated:
    notes:
    blockers:

  "06_research_foundation":
    name: "Research Foundation and Work Conditions"
    status: completed
    inputs:
      - "docs/00_研究基础.md"
      - "AGENTS.md"
      - "extraTex/2.1.研究基础.tex"
      - "extraTex/2.2.工作条件.tex"
      - "extraTex/2.3.承担项目.tex"
      - "extraTex/2.4.项目完成情况.tex"
    outputs:
      - "extraTex/2.1.研究基础.tex"
      - "extraTex/2.2.工作条件.tex"
      - "extraTex/2.3.承担项目.tex"
      - "extraTex/2.4.项目完成情况.tex"
    last_updated:
    notes:
    blockers:

  "07_other_statements":
    name: "Other Statements"
    status: completed
    inputs:
      - "extraTex/3.1.不同类型国基情况.tex"
      - "extraTex/3.2.同年单位不一致.tex"
      - "extraTex/3.3.承担中单位不一致.tex"
      - "extraTex/3.4.不同专业技术职务的申请.tex"
      - "extraTex/3.5.其它.tex"
    outputs:
      - "docs/其他说明检查报告.md"
    last_updated:
    notes:
    blockers:

  "08_reference_alignment":
    name: "Reference Alignment"
    status: completed
    inputs:
      - "extraTex/"
      - "references/myexample.bib"
    outputs:
      - "review/引用一致性审核报告.md"
    last_updated:
    notes:
    blockers:

  "09_length_control":
    name: "Length Control"
    status: completed
    inputs:
      - "extraTex/"
      - "AGENTS.md"
    outputs:
      - "review/篇幅控制报告.md"
    last_updated:
    notes:
    blockers:

  "10_humanization":
    name: "Humanization"
    status: completed
    inputs:
      - "extraTex/"
    outputs:
      - "review/去AI味修改报告.md"
    last_updated:
    notes:
    blockers:

  "11_qc":
    name: "Quality Control"
    status: completed
    inputs:
      - "extraTex/"
      - "references/myexample.bib"
      - "AGENTS.md"
    outputs:
      - "review/质量控制报告.md"
    last_updated:
    notes:
    blockers:

  "12_simulated_review":
    name: "Simulated Review"
    status: completed
    inputs:
      - "extraTex/"
      - "references/myexample.bib"
      - "AGENTS.md"
    outputs:
      - "review/模拟专家评审_全稿.md"
    last_updated:
    notes:
    blockers:

  "13_targeted_repair":
    name: "P0/P1 Targeted Repair"
    status: completed
    inputs:
      - "review/质量控制报告.md"
      - "review/模拟专家评审_全稿.md"
    outputs:
      - "review/P0P1定点修复报告.md"
      - "docs/评审意见修复清单.md"
    last_updated:
    notes:
    blockers:

  "14_compile":
    name: "Compile"
    status: completed
    inputs:
      - "main.tex"
      - "extraTex/"
      - "references/myexample.bib"
    outputs:
      - "main.pdf"
      - "review/编译检查报告.md"
    last_updated:
    notes:
    blockers:
